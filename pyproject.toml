[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uart-ble-sdk"
version = "0.2.0"
description = "Host SDK for UART-to-BLE transparent adapters. A new module is a new profile."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyserial"]

[project.scripts]
uart-ble = "uart_ble.cli:main"

[tool.setuptools.packages.find]
include = ["uart_ble*"]
